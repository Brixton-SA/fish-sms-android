name: Build

# Verifica que la app compile (debug) y que pasen los tests unitarios.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar debug y tests unitarios
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Subir APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: fish-sms-debug
          path: app/build/outputs/apk/debug/*.apk
