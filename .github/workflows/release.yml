name: Release

# Al pushear un tag v* (por ejemplo v1.0.0) compila el APK firmado y lo publica
# como asset "fish-sms.apk" del GitHub Release. Fish lo descarga desde
# https://github.com/Brixton-SA/fish-sms-android/releases/latest/download/fish-sms.apk
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Versión desde el tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "El tag debe tener la forma vX.Y.Z (recibido: $GITHUB_REF_NAME)"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_ENV"

      - name: Decodificar keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Falta el secret SIGNING_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fish-sms.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/fish-sms.jks" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Preparar fish-sms.apk
        run: cp app/build/outputs/apk/release/app-release.apk fish-sms.apk

      - name: Publicar en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: fish-sms.apk
          generate_release_notes: true
          prerelease: false
          make_latest: true

      - name: Borrar keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/fish-sms.jks"
